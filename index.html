<script>
const API_URL = "https://abonika-api.anik-bsl2010.workers.dev";

const initial = [
  {id:"p1",name:"Bed Home",price:890,category:"Bedsheet",description:"Soft everyday comfort",image:"https://images.unsplash.com/photo-1631049307264-da0ec9d70304?auto=format&fit=crop&w=800&q=80"},
  {id:"p2",name:"Floral Garden Bedsheet",price:899,category:"Bedsheet",description:"Floral design",image:"https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=800&q=80"},
  {id:"p3",name:"Sage Bloom Bed Set",price:1299,category:"Bedsheet",description:"Calm and elegant",image:"https://images.unsplash.com/photo-1631679706909-1844bbd07221?auto=format&fit=crop&w=800&q=80"},
  {id:"p4",name:"Classic Stripe Collection",price:999,category:"Bedsheet",description:"Classic stripes",image:"https://images.unsplash.com/photo-1616594039964-ae9021a400a0?auto=format&fit=crop&w=800&q=80"},
  {id:"p5",name:"Pastel Rose Bedsheet",price:1099,category:"Bedsheet",description:"Pastel rose pattern",image:"https://images.unsplash.com/photo-1615874694520-474822394e73?auto=format&fit=crop&w=800&q=80"}
];

let products = initial;
let cart = JSON.parse(localStorage.getItem("ab_cart") || "{}");
let filter = "";

async function loadProducts() {
  try {
    const response = await fetch(API_URL + "/products");
    if (!response.ok) throw new Error("API error");

    const data = await response.json();

    if (Array.isArray(data) && data.length > 0) {
      products = data.map(p => ({
        ...p,
        price: Number(p.price)
      }));
    } else {
      products = initial;
    }
  } catch (error) {
    console.error("Product load error:", error);
    products = initial;
  }

  renderFeatured();
  renderShop();
  renderCart();
  renderAdmin();
}

function go(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  let el = document.getElementById(id);
  if (el) el.classList.add("active");

  if (id === "cart") renderCart();
  if (id === "shop") renderShop();

  window.scrollTo(0, 0);
}

function card(p) {
  return `
    <div class="card">
      <img src="${p.image}" alt="${p.name}">
      <div class="cardbody">
        <h3>${p.name}</h3>
        <div class="price">৳${Number(p.price).toLocaleString()}</div>
        <p class="muted">${p.description || ""}</p>
        <button onclick="add('${p.id}')">Add to cart</button>
      </div>
    </div>`;
}

function renderShop() {
  let list = products.filter(p => !filter || p.category === filter);
  document.getElementById("shopcards").innerHTML = list.map(card).join("");
}

function filterCat(c) {
  filter = c;
  renderShop();
}

function renderFeatured() {
  document.getElementById("featured").innerHTML =
    products.slice(0, 4).map(card).join("");
}

function add(id) {
  cart[id] = (cart[id] || 0) + 1;
  localStorage.setItem("ab_cart", JSON.stringify(cart));
  renderCart();
  alert("Added to cart");
}

function renderCart() {
  let rows = Object.entries(cart).map(([id,q]) => {
    let p = products.find(x => x.id == id);
    return p ? {p,q} : null;
  }).filter(Boolean);

  document.getElementById("cartitems").innerHTML = rows.length
    ? rows.map(({p,q}) => `
      <div class="line">
        <span>${p.name} × ${q}
          <button onclick="qty('${p.id}',-1)">−</button>
          <button onclick="qty('${p.id}',1)">+</button>
        </span>
        <b>৳${p.price*q}</b>
      </div>`).join("")
    : "Cart is empty";

  document.getElementById("total").textContent =
    "৳" + rows.reduce((a,x) => a + x.p.price*x.q, 0);

  document.getElementById("count").textContent =
    rows.reduce((a,x) => a + x.q, 0);
}

function qty(id,n) {
  cart[id] = Math.max(0, (cart[id] || 0) + n);
  if (!cart[id]) delete cart[id];

  localStorage.setItem("ab_cart", JSON.stringify(cart));
  renderCart();
}

document.getElementById("accountForm").onsubmit = e => {
  e.preventDefault();

  localStorage.setItem(
    "ab_account",
    JSON.stringify(Object.fromEntries(new FormData(e.target).entries()))
  );

  document.getElementById("accountmsg").textContent =
    "Account details saved on this browser.";
};

document.getElementById("checkoutForm").onsubmit = e => {
  e.preventDefault();

  if (!Object.keys(cart).length) return alert("Cart empty");

  let d = Object.fromEntries(new FormData(e.target).entries());

  d.items = Object.entries(cart).map(([id,q]) => ({
    product: products.find(p => p.id == id)?.name,
    quantity: q
  }));

  let orders = JSON.parse(localStorage.getItem("ab_orders") || "[]");

  d.id = "AB" + Date.now();
  d.created = new Date().toLocaleString();

  orders.push(d);

  localStorage.setItem("ab_orders", JSON.stringify(orders));

  alert("Demo order saved in this browser.");

  cart = {};
  localStorage.setItem("ab_cart", "{}");

  e.target.reset();
  go("home");
};

function preview(i) {
  let f = i.files[0];
  let im = document.getElementById("preview");

  if (f && f.type.startsWith("image/") && f.size < 5*1024*1024) {
    im.src = URL.createObjectURL(f);
    im.style.display = "block";
  } else {
    alert("Choose image under 5MB");
    i.value = "";
  }
}

function admin() {
  go("adminpage");
}

function adminLogin() {
  let pass = prompt("Admin password");

  if (pass === "abonika2026") {
    document.getElementById("admincontent").style.display = "block";
    renderAdmin();
  } else {
    alert("Wrong password");
  }
}

document.getElementById("productForm").onsubmit = async e => {
  e.preventDefault();

  let f = new FormData(e.target);
  let file = f.get("image");

  if (!file || !file.size) return alert("Select image");

  if (file.size >= 5*1024*1024) {
    return alert("Choose image under 5MB");
  }

  let reader = new FileReader();

  reader.onload = async () => {
    let product = {
      id: "p" + Date.now(),
      name: f.get("name"),
      price: Number(f.get("price")),
      image: reader.result,
      category: f.get("category"),
      description: f.get("description")
    };

    try {
      let response = await fetch(API_URL + "/products", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(product)
      });

      let result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.message || result.error || "Save failed");
      }

      await loadProducts();

      e.target.reset();
      document.getElementById("preview").style.display = "none";

      alert("Product saved online!");
    } catch (error) {
      console.error(error);
      alert("Product save failed: " + error.message);
    }
  };

  reader.readAsDataURL(file);
};

function renderAdmin() {
  document.getElementById("adminproducts").innerHTML =
    products.map(p => `
      <div class="adminrow">
        ${p.name} • ৳${p.price}
        <button class="danger" onclick="del('${p.id}')">Delete</button>
      </div>
    `).join("");

  document.getElementById("orders").innerHTML =
    (JSON.parse(localStorage.getItem("ab_orders") || "[]")
      .reverse()
      .map(o => `
        <div class="adminrow">
          ${o.id} • ${o.name} • ${o.phone} • ${o.payment}
        </div>
      `).join("") || "No local demo orders");
}

async function del(id) {
  if (!confirm("Delete this product?")) return;

  try {
    let response = await fetch(
      API_URL + "/products/" + encodeURIComponent(id),
      { method: "DELETE" }
    );

    let result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || result.error || "Delete failed");
    }

    await loadProducts();
    alert("Product deleted online!");
  } catch (error) {
    console.error(error);
    alert("Delete failed: " + error.message);
  }
}

loadProducts();
</script>
